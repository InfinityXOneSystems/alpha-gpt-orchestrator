name: Echo Autonomous Tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Call Echo Tick
        env:
          ORCH_URL: ${{ secrets.ORCH_URL }}
        run: |
          curl -X POST "$ORCH_URL/echo/tick" \
            -H "Content-Type: application/json" \
            -d "{\"reason\":\"scheduled\"}"
